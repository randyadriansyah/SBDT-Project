
services:
  mysql-primary:
    image: mysql:8.4
    container_name: sbdt-mysql-primary
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./database/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800

  mysql-replica:
    image: mysql:8.4
    container_name: sbdt-mysql-replica
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3308:3306"

    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./database/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro

    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --read-only=ON
      - --super-read-only=ON

    depends_on:
      - mysql-primary

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: sbdt-keycloak
    restart: unless-stopped

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

    ports:
      - "8081:8080"

  backend:
    build: ./backend
    container_name: sbdt-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "3001:3000"

    depends_on:
      - mysql-primary
      - mysql-replica
      - keycloak

volumes:
  mysql_primary_data:
  mysql_replica_data:
